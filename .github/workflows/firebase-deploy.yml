
name: Deploy PRUX Firebase

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "web/**"
      - "functions/**"
      - "firebase.json"
      - "database.rules.json"
      - ".firebaserc"
      - ".github/workflows/firebase-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT" || {
            echo "Missing FIREBASE_SERVICE_ACCOUNT secret"
            exit 1
          }

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" \
            > "$RUNNER_TEMP/firebase-service-account.json"

          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" \
            >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Install Functions dependencies
        run: npm --prefix functions install --no-audit --no-fund

      - name: Check Functions syntax
        run: node --check functions/index.js

      - name: Ensure default Hosting site exists
        run: |
          firebase hosting:sites:create detectcameracentral \
            --project detectcameracentral || true

      - name: Deploy Hosting, Database rules and Functions
        run: |
          firebase deploy \
            --only hosting,database,functions \
            --project detectcameracentral \
            --non-interactive
